<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통계 · My Bookmarks</title>
<link rel="stylesheet" href="style.css">
<style>
  .stats-wrap { max-width: 720px; margin: 0 auto; padding: 48px 24px 80px; }
  .stats-wrap h1 { font-size: 22px; margin: 0 0 28px; }
  .stats-section { margin-bottom: 36px; }
  .stats-section h2 { font-size: 15px; color: var(--text-muted); margin: 0 0 12px; font-weight: 700; }
  .stats-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .stats-card { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; }
  .stats-card .num { font-size: 26px; font-weight: 700; }
  .stats-card .label { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; }
  .stats-gate { text-align: center; padding: 80px 20px; color: var(--text-muted); }
  .stats-gate p { margin: 0 0 4px; font-size: 14px; }
  .stats-table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 14px; }
  .stats-table th, .stats-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .stats-table th { color: var(--text-muted); font-weight: 600; }
</style>
</head>
<body>
<div class="stats-wrap" id="statsRoot">
  <h1>통계</h1>
  <div id="gate" class="stats-gate">불러오는 중...</div>
  <div id="content" hidden>
    <div class="stats-section">
      <h2>가입자</h2>
      <div class="stats-cards">
        <div class="stats-card"><div class="num" id="signupTotal">-</div><div class="label">누적 가입자</div></div>
        <div class="stats-card"><div class="num" id="signupToday">-</div><div class="label">오늘 신규</div></div>
        <div class="stats-card"><div class="num" id="signup7">-</div><div class="label">최근 7일</div></div>
        <div class="stats-card"><div class="num" id="signup30">-</div><div class="label">최근 30일</div></div>
      </div>
    </div>
    <div class="stats-section">
      <h2>방문자</h2>
      <div class="stats-cards">
        <div class="stats-card"><div class="num" id="viewTotal">-</div><div class="label">누적 방문 (전체)</div></div>
        <div class="stats-card"><div class="num" id="viewUnique">-</div><div class="label">순 방문자 (최근 60일)</div></div>
        <div class="stats-card"><div class="num" id="viewToday">-</div><div class="label">오늘 방문</div></div>
        <div class="stats-card"><div class="num" id="view7">-</div><div class="label">최근 7일</div></div>
      </div>
    </div>
    <div class="stats-section">
      <h2>최근 14일 추이</h2>
      <table class="stats-table">
        <thead><tr><th>날짜</th><th>신규 가입</th><th>방문</th></tr></thead>
        <tbody id="trendBody"></tbody>
      </table>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
