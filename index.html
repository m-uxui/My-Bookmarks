<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookmarks</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Auth screen -->
<div id="authScreen" class="auth-screen" hidden>
  <div class="auth-card">
    <div class="auth-brand">✦ My Bookmarks</div>
    <p class="auth-sub">로그인하면 나만의 북마크를 저장하고 어디서든 볼 수 있어요.</p>
    <button id="googleLoginBtn" class="btn btn-social btn-google">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47a5.54 5.54 0 0 1-2.4 3.63v3h3.88c2.27-2.09 3.57-5.17 3.57-8.82Z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.91l-3.88-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.11A12 12 0 0 0 12 24Z"/><path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.89 12c0-.79.14-1.56.38-2.28V6.61H1.27A12 12 0 0 0 0 12c0 1.94.46 3.77 1.27 5.39l4-3.11Z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.27 6.61l4 3.11C6.22 6.86 8.87 4.75 12 4.75Z"/></svg>
      Google로 로그인
    </button>
    <button id="kakaoLoginBtn" class="btn btn-social btn-kakao">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#191600" d="M12 3C6.48 3 2 6.58 2 11c0 2.85 1.86 5.36 4.66 6.79-.2.75-.75 2.78-.86 3.21-.13.53.2.52.42.38.17-.11 2.73-1.86 3.84-2.62.62.09 1.26.14 1.94.14 5.52 0 10-3.58 10-8s-4.48-8-10-8Z"/></svg>
      카카오로 로그인
    </button>
  </div>
</div>

<div class="app" id="appRoot" hidden>

  <header class="topbar">
    <div class="brand">
      <span class="brand-text">My Bookmarks</span>
    </div>

    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" type="text" placeholder="북마크 검색 (제목, 주소, 메모)">
    </div>

    <div class="topbar-actions">
      <button id="importBtn" class="btn btn-ghost" title="JSON 파일에서 가져오기">가져오기</button>
      <button id="exportBtn" class="btn btn-ghost" title="JSON 파일로 내보내기">내보내기</button>
      <input id="importFile" type="file" accept="application/json" hidden>
      <button id="addBookmarkBtn" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        북마크 추가
      </button>
      <button id="logoutBtn" class="icon-btn" title="로그아웃">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar">
      <div class="sidebar-title">카테고리</div>
      <ul id="categoryList" class="category-list"></ul>
      <button id="addCategoryBtn" class="add-category-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        카테고리 추가
      </button>
    </aside>

    <main class="content">
      <div class="content-head">
        <h1 id="activeCategoryTitle">전체</h1>
        <span id="resultCount" class="result-count"></span>
        <button id="categoryTitleEditBtn" class="icon-btn title-edit-btn" title="카테고리 수정" hidden></button>
      </div>
      <div id="grid" class="grid"></div>
      <div id="emptyState" class="empty-state" hidden>
        <p>아직 북마크가 없어요.</p>
        <button class="btn btn-primary" id="emptyAddBtn">첫 북마크 추가하기</button>
      </div>
    </main>
  </div>
</div>

<!-- Bookmark Add/Edit Modal -->
<div id="bookmarkModal" class="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-head">
      <h2 id="bookmarkModalTitle">북마크 추가</h2>
      <button class="modal-close" data-close>&times;</button>
    </div>
    <form id="bookmarkForm" class="modal-body">
      <input type="hidden" id="bookmarkId">
      <label class="field">
        <span>URL <em>*</em></span>
        <input id="bookmarkUrl" type="text" placeholder="https://www.figma.com" required>
      </label>
      <label class="field">
        <span>제목</span>
        <input id="bookmarkTitle" type="text" placeholder="비워두면 주소에서 자동으로 채워요">
      </label>
      <label class="field">
        <span>카테고리</span>
        <select id="bookmarkCategory"></select>
      </label>
      <label class="field">
        <span>커버 이미지 URL (선택)</span>
        <input id="bookmarkImage" type="text" placeholder="비워두면 파비콘으로 자동 생성돼요">
      </label>
      <label class="field">
        <span>메모 (선택)</span>
        <textarea id="bookmarkNote" rows="2" placeholder="어디에 쓰는 사이트인지 메모"></textarea>
      </label>
      <div class="modal-actions">
        <button type="button" id="deleteBookmarkBtn" class="btn btn-danger" hidden>삭제</button>
        <div class="spacer"></div>
        <button type="button" class="btn btn-ghost" data-close>취소</button>
        <button type="submit" class="btn btn-primary">저장</button>
      </div>
    </form>
  </div>
</div>

<!-- Category Add/Edit Modal -->
<div id="categoryModal" class="modal-overlay" hidden>
  <div class="modal modal-sm">
    <div class="modal-head">
      <h2 id="categoryModalTitle">카테고리 추가</h2>
      <button class="modal-close" data-close>&times;</button>
    </div>
    <form id="categoryForm" class="modal-body">
      <input type="hidden" id="categoryId">
      <label class="field">
        <span>이름 <em>*</em></span>
        <input id="categoryName" type="text" placeholder="예: 타이포그래피" required>
      </label>
      <div class="modal-actions">
        <button type="button" id="deleteCategoryBtn" class="btn btn-danger" hidden>삭제</button>
        <div class="spacer"></div>
        <button type="button" class="btn btn-ghost" data-close>취소</button>
        <button type="submit" class="btn btn-primary">저장</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
